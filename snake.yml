name: Generate contribution snake animation

on:
  schedule:
    - cron: "0 0 * * *"   # daily at midnight UTC
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVGs from contribution graph
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#0A66C2&color_dots=#E8ECF1,#BCD6F2,#7FB0E6,#3F86D6,#0A66C2
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#F2B84B&color_dots=#161B22,#132B44,#1F4E7E,#2F74B8,#58A2EE

      - name: Push generated SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
